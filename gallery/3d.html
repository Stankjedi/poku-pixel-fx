<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POKU Pixel FX · 3D VFX Engine</title>
  <meta name="description" content="코드 기반 3D 픽셀아트 이펙트 엔진: 시네마틱 광원, 블랙홀, 나선수리검, 얼음 및 참격 실시간 체험.">
  <style>
    @font-face{font-family:"Poku Studio UI";src:url("fonts/SUIT-Variable.woff2") format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#090e19;color:#d7eaff;font:14px "Poku Studio UI",system-ui,sans-serif}
    button,select,input,textarea{font-family:inherit}
    main{display:flex;flex-direction:column;min-height:100vh}.top{padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}
    .title{font-weight:800;letter-spacing:.13em;font-size:13px}.sub{color:#7798bd;font-size:11px;margin-top:5px}
    .back{font-size:12px;color:#9fc4e6;text-decoration:none}.back:hover{color:#fff}
    .screen{position:relative;flex:1;min-height:450px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#122b42,#0c1529 55%,#060b15)}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}
    .legend{position:absolute;left:20px;bottom:17px;color:#8aafd0;font-size:11px;pointer-events:none}
    .stage{position:absolute;right:20px;top:18px;color:#b6edff;font-size:12px;letter-spacing:.12em}
    .controls{padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#0c1423;border-top:1px solid #1a3047}
    button,select{border:1px solid #34607c;background:#173149;border-radius:6px;color:#e2f7ff;padding:9px 12px;font-weight:650;cursor:pointer}
    button:hover,select:hover{background:#215070}label{display:flex;align-items:center;gap:7px;color:#a9cce0;font-size:12px}
    input[type=range]{accent-color:#79dffe;width:94px}input[type=checkbox]{accent-color:#79dffe}
    .readout{margin-left:auto;font-variant-numeric:tabular-nums;color:#87a8c4;font-size:12px}
    .notes{padding:11px 20px;color:#6986a2;border-top:1px solid #15263b;display:flex;justify-content:space-between;gap:15px;font-size:11px}
    .notes span{max-width:75ch}.seed{color:#a6c4de;font-size:11px;min-width:90px}
    @media(max-width:700px){.screen{min-height:56vh}.top{padding:13px}.controls{padding:12px;gap:8px}.readout{margin-left:0}.notes{flex-direction:column}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <div><div class="title">POKU / PIXEL FX / 3D</div><div class="sub">DETERMINISTIC · WORLD SPACE · PIXEL-CRISP HDR · MULTISCALE BLOOM</div></div>
    <a class="back" href="studio.html">제작 Studio</a><a class="back" href="index.html">← 2D GALLERY</a>
  </div>
  <div class="screen" id="screen">
    <canvas id="view" aria-label="Interactive 3D pixel art VFX preview"></canvas>
    <div class="stage" id="stage">CONDENSE</div>
    <div class="legend">DRAG · ORBIT　 SCROLL · ZOOM　 SPACE · RESTART</div>
  </div>
  <div class="controls">
    <label>VFX <select id="effect" aria-label="이펙트 선택"><option value="blackhole">BLACK HOLE</option><option value="wind">WIND RASENSHURIKEN · REFINED</option><option value="windOriginal">WIND RASENSHURIKEN · ORIGINAL</option><option value="voidrift">VOID RIFT · 공허의 균열</option><option value="shield">ENERGY SHIELD · 에너지 방벽</option>
          <option value="laser">COHERENT LASER · 레이저 빔</option><option value="meteor">METEOR IMPACT · 메테오 충돌</option><option value="water">CROWN SPLASH · 왕관 물보라</option><option value="lightning">FORKED LIGHTNING</option><option value="flame">THERMAL PLUME</option><option value="shatter">ICE SHATTER</option><option value="frost">FROST NOVA</option><option value="slash">ARC SLASH</option></select></label>
    <button id="replay" type="button">↻ REPLAY</button>
    <button id="pause" type="button">Ⅱ PAUSE</button>
    <button id="seed" type="button">NEW SEED</button>
    <label>PIXEL <input type="range" id="pixel" min="2" max="7" value="3"><span id="pxText">3×</span></label>
    <label>CAMERA <input type="range" id="elevation" min="10" max="75" value="28"><span id="elText">28°</span></label>
    <label>CINEMATIC 미리보기 <input type="checkbox" id="glow" checked></label>
    <label>렌더러 <select id="backend"><option value="cpu">CPU</option><option value="webgpu">WebGPU HDR</option></select></label><label><input id="exact" type="checkbox" checked>정수 픽셀</label><button id="project" type="button">프로젝트 ↓</button>
    <button id="open-project" type="button">프로젝트 열기</button><button id="save" type="button">PNG ↓</button>
    <span class="seed" id="seedText">SEED 4318</span><span class="readout" id="readout">0.00 / 7.00 s</span>
  </div>
  <div class="controls"><button id="previous">−1 프레임</button><input id="timeline" type="range" min="0" max="7" step=".033333333" value="0" style="flex:1"><button id="next">+1 프레임</button><label>노출 <input id="exposure" type="range" min="0" max="4" step=".05" value="1.3"></label><label>Bloom <input id="bloom" type="range" min="0" max="3" step=".05" value="1.1"></label><label><input id="grid" type="checkbox">바닥</label><label><input id="camera-motion" type="checkbox">카메라 반응</label></div>
  <details style="padding:12px 20px"><summary>카메라·조명·렌더 프로필</summary><textarea id="profile-json" style="width:100%;min-height:180px;background:#101a28;color:#cfdfef;margin:12px 0;font:12px ui-monospace,'Poku Studio UI',monospace" aria-label="3D RenderProfile JSON"></textarea><button id="refresh-profile">현재 설정 읽기</button> <button id="apply-profile">프로필 적용</button></details>
  <input id="project-file" type="file" accept=".json" hidden>
  <div class="notes"><span id="status">3D Pixel Black Hole</span><span id="renderer-status" role="status">CPU cinematic</span></div>
</main>
<script type="module" src="3d.js"></script>
</body>
</html>
