<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Native character studies</title><style>body{margin:24px;background:#182433;color:#e4dbc3;font:16px system-ui}canvas,img{image-rendering:pixelated;display:block;margin:12px 0}canvas{background:#243544}button,select{font:inherit}figure{margin:0 0 24px}small{color:#b5c7c4}</style><h1>Native character studies</h1><p><button id="play">Pause</button> <label>Display <select id="zoom"><option value="1">1× native</option><option value="2" selected>2× integer</option><option value="3">3× integer</option></select></label> <small>60 held cels / 30 fps / 2 s. Display scaling never resizes source assets.</small></p><canvas id="scene" width="192" height="160"></canvas><p id="status"></p><figure><img src="character-reference-native.png" alt="Four original characters, key poses and four discrete views"><figcaption>Native reference sheet</figcaption></figure><figure><img src="pixel-techniques-native.png" alt="Twelve native material and cluster techniques"><figcaption>32 × 32 native technique studies</figcaption></figure><figure><img src="equipment-native.png" alt="Swords and bow grip at ready, contact, draw and release"></figure><figure><img src="shared-identity-portraits.png" alt="Shared identity portrait expressions"></figure><script>const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),atlas=new Image();ctx.imageSmoothingEnabled=false;let running=true,start=performance.now(),held=0;const zoom=document.querySelector('#zoom');function resize(){canvas.style.width=(192*Number(zoom.value))+'px';canvas.style.height=(160*Number(zoom.value))+'px'}zoom.onchange=resize;resize();document.querySelector('#play').onclick=()=>{running=!running;if(running)start=performance.now()-held/30*1000;document.querySelector('#play').textContent=running?'Pause':'Play'};function draw(now){const index=running?Math.floor((now-start)/1000*30)%60:held;held=index;ctx.clearRect(0,0,192,160);ctx.drawImage(atlas,index%10*192,Math.floor(index/10)*160,192,160,0,0,192,160);document.querySelector('#status').textContent='Frame '+index+' · '+(index/30).toFixed(2)+' s';requestAnimationFrame(draw)}atlas.onload=()=>requestAnimationFrame(draw);atlas.src='idle-atlas.png';</script>
