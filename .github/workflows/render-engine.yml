name: Render engine regression

on:
  push:
    branches:
      - main
      - "feat/cinematic-lighting-engine-20261103"
  pull_request:
    paths:
      - "src/**"
      - "gallery/**"
      - "tools/**"
      - "tests/**"
      - "package*.json"
      - "tsconfig*.json"
      - ".github/workflows/render-engine.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ensure optional GIF encoder is available for integration QA
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: npm run test:3d
      - run: npm run test:quality
      - run: npm run test:export
      - run: npm run test:review
      - run: npm run test:aseprite
      - name: Smoke-test integrated cinematic image exports
        run: |
          for effect in frost slash blackhole wind windOriginal water shield; do
            node build-tools/tools/render-3d.mjs "$effect" --frames 3 --width 96 --height 72 --columns 3 --cinematic true --out "/tmp/${effect}-cinematic.png"
            test -s "/tmp/${effect}-cinematic.png"
          done
      - name: Save visual QA sheets
        uses: actions/upload-artifact@v4
        with:
          name: unified-cinematic-render-sheets
          path: /tmp/*-cinematic.png
          retention-days: 7
